name: Render Long
run-name: Render long ${{ inputs.job_id }} (attempt ${{ inputs.attempt }})

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Unique job id"
        required: true
      payload:
        description: "Script JSON built by n8n"
        required: true
      attempt:
        description: "Auto-resume counter (leave as 1)"
        required: false
        default: "1"

permissions:
  contents: write
  actions: write

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PAYLOAD: ${{ inputs.payload }}
      JOB_ID: ${{ inputs.job_id }}
      ATTEMPT: ${{ inputs.attempt }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      N8N_CALLBACK_URL_LONG: ${{ secrets.N8N_CALLBACK_URL_LONG }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache Whisper models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-models-v1

      - name: Restore partial work (resume after a failure)
        uses: actions/cache/restore@v4
        with:
          path: |
            work_long
            !work_long/frames
          key: long-${{ inputs.job_id }}-none
          restore-keys: |
            long-${{ inputs.job_id }}-

      - name: Install ffmpeg + fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-montserrat fonts-noto-core
          pip install -r requirements.txt

      - name: Install UI-scene renderer (puppeteer-core, uses the runner's own Chrome)
        run: (cd tools/ui_scenes && npm install --silent --no-audit --no-fund)

      - name: Render
        id: render
        run: |
          printf '%s' "$PAYLOAD" > payload.json
          python render_long.py payload.json

      - name: Save partial work (so a retry resumes here)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            work_long
            !work_long/frames
          key: long-${{ inputs.job_id }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.attempt }}

      - name: Quality check (QC)
        continue-on-error: true
        run: |
          (cd tools/qc && npm install --silent --no-audit --no-fund)
          F="out/long_${JOB_ID}.mp4"
          node tools/qc/verify-render.mjs --input "$F" --size 1280x720 --fps 24 --min-duration 10 --max-duration 3600 --loudness=-20:-12 --report out/qc.json || true
          node tools/qc/proof-sheet.mjs --inputs "$F" --frames 8 --out out/proof.png || true
          if [ -f out/qc.json ]; then
            jq --slurpfile q out/qc.json '. + {qc: {ok: $q[0].ok, errors: ($q[0].errors // []), warnings: ($q[0].warnings // [])}}' out/result.json > out/r2.json && mv out/r2.json out/result.json
          fi

      - name: Publish video as Release asset
        id: publish
        run: |
          TAG="long-${JOB_ID}"
          ASSETS=("out/long_${JOB_ID}.mp4")
          if [ -f out/proof.png ]; then
            ASSETS+=("out/proof.png")
            echo "proof=https://github.com/${{ github.repository }}/releases/download/${TAG}/proof.png" >> "$GITHUB_OUTPUT"
          fi
          gh release create "$TAG" "${ASSETS[@]}" --title "Long $JOB_ID" --notes "auto-rendered" --latest=false
          echo "url=https://github.com/${{ github.repository }}/releases/download/${TAG}/long_${JOB_ID}.mp4" >> "$GITHUB_OUTPUT"
          gh release list --limit 100 --json tagName --jq '[.[] | select(.tagName | startswith("long-"))] | .[6:][].tagName' | xargs -r -I{} gh release delete {} --cleanup-tag -y || true

      - name: Upload to YouTube as private draft (only if enabled and QC passed)
        continue-on-error: true
        run: |
          python tools/yt_upload.py "out/long_${JOB_ID}.mp4" payload.json out/result.json || true
          if [ -f out/youtube.json ]; then
            jq --slurpfile y out/youtube.json '. + {youtube: $y[0]}' out/result.json > out/r3.json && mv out/r3.json out/result.json
          fi

      - name: Notify n8n (success)
        if: success()
        run: |
          [ -z "$N8N_CALLBACK_URL_LONG" ] && echo "no callback configured" && exit 0
          jq -n --arg job "$JOB_ID" --arg url "${{ steps.publish.outputs.url }}" --arg proof "${{ steps.publish.outputs.proof }}" --argjson res "$(cat out/result.json)" --argjson payload "$(cat payload.json)" \
            '{ok:true, job_id:$job, video_url:$url, proof_url:$proof, result:$res, meta:$payload.meta}' \
          | curl -sS -X POST "$N8N_CALLBACK_URL_LONG" -H 'Content-Type: application/json' -d @- --retry 3 --retry-delay 5

      - name: Auto-resume after a failure (up to 3 attempts)
        if: failure() && fromJSON(inputs.attempt) < 3
        run: |
          NEXT=$(( ATTEMPT + 1 ))
          echo "Attempt $ATTEMPT failed. Re-dispatching attempt $NEXT (finished work is restored from cache)."
          gh workflow run render_long.yml -f job_id="$JOB_ID" -f payload="$PAYLOAD" -f attempt="$NEXT"

      - name: Notify n8n (failure, final attempt)
        if: failure() && fromJSON(inputs.attempt) >= 3
        run: |
          [ -z "$N8N_CALLBACK_URL_LONG" ] && exit 0
          PAYLOAD_JSON=$(cat payload.json 2>/dev/null || echo '{}')
          jq -n --arg job "$JOB_ID" --arg run "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" --argjson payload "$PAYLOAD_JSON" \
            '{ok:false, job_id:$job, error:"render failed after 3 attempts", run_url:$run, meta:$payload.meta}' \
          | curl -sS -X POST "$N8N_CALLBACK_URL_LONG" -H 'Content-Type: application/json' -d @- --retry 3 --retry-delay 5
