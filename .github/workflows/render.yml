name: Render Short
run-name: Render ${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Unique job id"
        required: true
      payload:
        description: "Script + scenes JSON (built by n8n)"
        required: true

permissions:
  contents: write   # needed to publish the finished video as a Release asset

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PAYLOAD: ${{ inputs.payload }}
      JOB_ID: ${{ inputs.job_id }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      POLLINATIONS_KEY: ${{ secrets.POLLINATIONS_KEY }}
      N8N_CALLBACK_URL: ${{ secrets.N8N_CALLBACK_URL }}
      N8N_CALLBACK_URL_MOTIV: ${{ secrets.N8N_CALLBACK_URL_MOTIV }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg + fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-montserrat fonts-noto-core
          pip install -r requirements.txt

      - name: Render
        id: render
        run: |
          printf '%s' "$PAYLOAD" > payload.json
          python render.py payload.json

      - name: Publish video as Release asset
        id: publish
        run: |
          FILE="out/short_${JOB_ID}.mp4"
          gh release create "$JOB_ID" "$FILE" --title "Short $JOB_ID" --notes "auto-rendered" --latest=false
          echo "url=https://github.com/${{ github.repository }}/releases/download/${JOB_ID}/short_${JOB_ID}.mp4" >> "$GITHUB_OUTPUT"
          # keep only the newest 30 releases so the repo stays clean
          gh release list --limit 200 --json tagName --jq '.[30:][].tagName' | xargs -r -I{} gh release delete {} --cleanup-tag -y || true

      - name: Notify n8n (success)
        if: success()
        run: |
          URL="$N8N_CALLBACK_URL"
          if [ "$(jq -r '.callback_key // empty' payload.json 2>/dev/null)" = "motiv" ]; then URL="$N8N_CALLBACK_URL_MOTIV"; fi
          [ -z "$URL" ] && echo "no callback configured" && exit 0
          RESULT=$(cat out/result.json)
          jq -n --arg job "$JOB_ID" --arg url "${{ steps.publish.outputs.url }}" --argjson res "$RESULT" --argjson payload "$(cat payload.json)" \
            '{ok:true, job_id:$job, video_url:$url, result:$res, meta:$payload.meta}' \
          | curl -sS -X POST "$URL" -H 'Content-Type: application/json' -d @- --retry 3 --retry-delay 5

      - name: Notify n8n (failure)
        if: failure()
        run: |
          URL="$N8N_CALLBACK_URL"
          if [ "$(jq -r '.callback_key // empty' payload.json 2>/dev/null)" = "motiv" ]; then URL="$N8N_CALLBACK_URL_MOTIV"; fi
          [ -z "$URL" ] && echo "no callback configured" && exit 0
          PAYLOAD_JSON=$(cat payload.json 2>/dev/null || echo '{}')
          jq -n --arg job "$JOB_ID" --arg run "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" --argjson payload "$PAYLOAD_JSON" \
            '{ok:false, job_id:$job, error:"render failed", run_url:$run, meta:$payload.meta}' \
          | curl -sS -X POST "$URL" -H 'Content-Type: application/json' -d @- --retry 3 --retry-delay 5
